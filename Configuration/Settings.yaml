DL:
  HoneypotFormField:

    # If set to true, all finishers that are configured after the SpamDetectionFinisher are skipped.
    cancelSubsequentFinishersOnSpamDetection: false

    # Log the form data to the system log when classified as spam.
    logSpamFormData: false

    # Timestamp validation settings
    # Minimum age in seconds - prevents instant bot submissions (default: 10 seconds)
    minimumTimestampAge: 10

    # Maximum age in seconds - prevents replay attacks (default: 86400 seconds = 24 hours)
    maximumTimestampAge: 86400
